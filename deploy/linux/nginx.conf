worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Docker's resolver refreshes the upstream after an edge container restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $ssl_preread_protocol $switch_upstream {
        ""      edge:8081;
        default edge:8443;
    }

    server {
        listen 28001;
        ssl_preread on;
        preread_timeout 10s;
        proxy_pass $switch_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 330s;
    }
}
