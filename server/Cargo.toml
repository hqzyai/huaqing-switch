[package]
name = "huaqing-switch-server"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
publish = false

[features]
default = []

[lints.rust]
# Shared sources declare desktop wrappers; this crate intentionally cannot enable them.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("desktop"))'] }

[dependencies]
anyhow = "1"
base64 = "0.22"
ring = "0.17"
async-stream = "0.3"
axum = "0.7"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hmac = "0.12"
http-body-util = "0.1"
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "set-header", "timeout"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "thin"
